name: build

# Her PR'da ve main branch'e push'ta çalışır
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_call:

permissions:
    contents: read
    pull-requests: read

# Aynı branch/PR için eski çalıştırmayı iptal et
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Hangi dosyaların değiştiğini tespit et; gereksiz çalıştırmalardan kaçın
    degisiklikleri-tespit-et:
        name: Değişiklikleri Tespit Et
        runs-on: ubuntu-latest
        outputs:
            vscode: ${{ steps.zorla.outputs.hepsini_calistir == 'true' || steps.filtre.outputs.vscode == 'true' }}
            sdk: ${{ steps.zorla.outputs.hepsini_calistir == 'true' || steps.filtre.outputs.sdk == 'true' }}
        steps:
            - id: zorla
              # push veya workflow_call olduğunda tüm işleri her zaman çalıştır
              if: github.event_name == 'push' || github.event_name == 'workflow_call'
              run: echo "hepsini_calistir=true" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v4
              if: steps.zorla.outputs.hepsini_calistir != 'true'

            - uses: dorny/paths-filter@v3
              if: steps.zorla.outputs.hepsini_calistir != 'true'
              id: filtre
              with:
                  filters: |
                      vscode:
                          - 'apps/vscode/src/**'
                          - 'apps/vscode/webview-ui/src/**'
                          - 'apps/vscode/proto/**'
                          - 'apps/vscode/package.json'
                          - 'apps/vscode/webview-ui/package.json'
                          - 'apps/vscode/tsconfig*.json'
                          - 'apps/vscode/biome.jsonc'
                          - 'apps/vscode/esbuild.mjs'
                          - 'bun.lock'
                          - 'sdk/packages/**'
                          - '.github/workflows/build.yml'
                      sdk:
                          - 'sdk/packages/**'
                          - 'bun.lock'
                          - '.github/workflows/build.yml'

    # TypeScript tip kontrolü + lint + format (paralel)
    kalite-kontrol:
        name: Kalite Kontrol (Tip / Lint / Format)
        needs: degisiklikleri-tespit-et
        if: needs.degisiklikleri-tespit-et.outputs.vscode == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/vscode
        steps:
            - name: Kodu İndir
              uses: actions/checkout@v4

            - name: Bun Kurulumu
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Bağımlılıkları Yükle
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: SDK Paketlerini Derle
              working-directory: ${{ github.workspace }}
              run: bun run build:sdk

            - name: better-sqlite3 Binary Kontrolü
              run: |
                  NODE_FILE="node_modules/better-sqlite3/build/Release/better_sqlite3.node"
                  if [ ! -f "$NODE_FILE" ]; then
                    echo "HATA: better-sqlite3 native binary bulunamadı: apps/vscode/$NODE_FILE"
                    exit 1
                  fi
                  echo "better-sqlite3 binary mevcut: $NODE_FILE"

            # check-types + lint + format kontrollerini paralel çalıştır
            - name: Tüm Kalite Kontrollerini Çalıştır
              run: bun run ci:check-all

    # Birim testleri
    birim-testler:
        name: Birim Testler
        needs: [degisiklikleri-tespit-et, kalite-kontrol]
        if: needs.degisiklikleri-tespit-et.outputs.vscode == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/vscode
        steps:
            - name: Kodu İndir
              uses: actions/checkout@v4

            - name: Bun Kurulumu
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Bağımlılıkları Yükle
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: SDK Paketlerini Derle
              working-directory: ${{ github.workspace }}
              run: bun run build:sdk

            - name: better-sqlite3 Binary Kontrolü
              run: |
                  NODE_FILE="node_modules/better-sqlite3/build/Release/better_sqlite3.node"
                  if [ ! -f "$NODE_FILE" ]; then
                    echo "HATA: better-sqlite3 native binary bulunamadı"
                    exit 1
                  fi

            - name: Extension Derleme (test hazırlığı)
              run: bun run ci:build

            - name: Vitest (SDK adaptör + model kataloğu)
              run: |
                  OUTPUT=$(bun run test:vitest 2>&1)
                  echo "$OUTPUT"
                  COUNT=$(echo "$OUTPUT" | grep -oP '\d+ passed' | head -1 | grep -oP '\d+' || echo "0")
                  if [[ "$COUNT" == "0" ]]; then
                    echo "HATA: Hiç test geçmedi — test bulunamıyor olabilir"
                    exit 1
                  fi
                  echo "Geçen test sayısı: $COUNT"

            - name: Bun Birim Testleri
              run: bun run test:unit
